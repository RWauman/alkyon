# Development databases for Alkyon. Non-default host ports so this never collides
# with a local PostgreSQL or SQL Server install.
#
#   docker compose -f docker/compose.dev.yml up -d
#   docker compose -f docker/compose.dev.yml down -v
name: alkyon-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: alkyon-dev
      POSTGRES_DB: alkyon_demo
    ports:
      - "55432:5432"
    volumes:
      - ./seed/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alkyon_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The demo schema lives in a database called `sales`, not a schema inside
  # `alkyon_demo`. That is not a shortcut: MySQL has no schema layer, a schema
  # *is* a database, so `sales.order_line` is the honest spelling here and the
  # dialect-agnostic tests read the same against all three engines.
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: alkyon-dev
      MYSQL_DATABASE: sales
    ports:
      - "53306:3306"
    volumes:
      - ./seed/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-palkyon-dev"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s

  # Document-shaped on purpose: nested documents, arrays, absent fields and one
  # collection where the same field holds four different types. See the seed.
  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: alkyon
      MONGO_INITDB_ROOT_PASSWORD: alkyon-dev
      # The database the init scripts run against, and the one the demo lives in.
      MONGO_INITDB_DATABASE: alkyon_demo
    ports:
      - "57017:27017"
    volumes:
      - ./seed/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 20

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Alkyon-dev-1"
      MSSQL_PID: Developer
    ports:
      - "51433:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The SQL Server image has no init-script hook, so seed it once the server is up.
  mssql-seed:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./seed/mssql:/seed:ro
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -S
      - mssql
      - -U
      - sa
      - -P
      - Alkyon-dev-1
      - -C
      - -b
      - -i
      - /seed/01-demo.sql
    restart: "no"

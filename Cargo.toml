[package]
name = "alkyon"
version = "1.0.0"
edition = "2021"
description = "A portable data workbench: real dialect SQL, optional federation, and a terminal your LLM agent can drive."
# PolyForm Noncommercial has no SPDX identifier, so the file is named instead of
# a code. Not publishable to crates.io, which takes OSI licences only.
license-file = "LICENSE"
publish = false
default-run = "alkyon"

[features]
# The desktop shell. On by default because that is how alkyon is used; a
# container has no display and no webview, so the image builds with
# `--no-default-features` and never pulls Tauri or its system dependency in.
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
# Tauri drives the webview the platform already ships — WebView2 on Windows,
# WebKitGTK on Linux, WKWebView on macOS — so nothing here bundles a browser and
# the binary stays the size DuckDB made it. The window is pointed at alkyon's own
# HTTP server rather than at embedded assets: that is what keeps one UI, served
# one way, whether it is in this window or in a browser tab.
tauri = { version = "2", optional = true , features = [] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"

thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rust-embed = "8"
mime_guess = "2"

chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
# `v4` is what mints the PKCE verifier and the sign-in tickets, so the random
# bytes come from the crate already here rather than from a second RNG.
uuid = { version = "1", features = ["serde", "v4"] }
rust_decimal = "1"

# Entra sign-in and the Azure storage REST API. `rustls-tls` rather than the
# platform TLS: the rest of the binary already speaks rustls, and webpki roots
# keep one less thing depending on how the host is configured.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# PKCE: the challenge is base64url(sha256(verifier)), and there is no lighter way
# to say that.
sha2 = "0.10"
base64 = "0.22"

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "mysql",
    "json",
    "chrono",
    "uuid",
    "rust_decimal",
] }

tiberius = { version = "0.12", default-features = false, features = [
    "rustls",
    "tds73",
    "chrono",
    "rust_decimal",
    "sql-browser-tokio",
    "winauth",
] }
tokio-util = { version = "0.7", features = ["compat"] }

# The official driver. Its defaults are rustls and a DNS resolver, which is what
# `mongodb+srv://` needs and what the rest of the binary already speaks.
mongodb = "3"

directories = "6"
portable-pty = "0.9"

# The federation engine. `bundled` statically links DuckDB, which is what keeps
# the single-binary promise — at the cost of a much larger binary and a slow
# first build.
# `parquet` and `json` link those extensions in statically. Without them DuckDB
# looks for `~/.duckdb/extensions/…` and wants to download, which would break the
# offline promise the moment anyone reads a parquet file.
duckdb = { version = "1.10505", features = ["bundled", "parquet", "json"] }
# Excel, read in-process rather than through DuckDB's `excel` extension, so that
# reading a spreadsheet never needs a network download.
# `dates` is what turns an Excel serial number back into a real datetime.
calamine = { version = "0.36", features = ["dates"] }

# The platform backend is a feature, and enabling the wrong one for the target
# fails to build — so pick it per target rather than in the shared table.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
# `oneshot` drives the router without binding a socket; the WebSocket tests need
# a real client, and this is the one axum itself already pulls in.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# Optimise a debug build, because `cargo run` is what anyone actually uses and
# unoptimised it did not feel slow, it felt broken.
#
# Streaming one million rows out of a parquet, measured end to end:
#
#   stock `cargo run`                     26.4 s
#   dependencies at -O3                   14.9 s
#   …and this crate at -O1                 1.5 s
#   `cargo build --release`                1.3 s
#
# So a debug build now runs at release speed, and the same recipe fixed DuckDB:
# its C++ takes the `-O` level from the profile, and `count(*)` with a `sum()`
# over 39.6M parquet rows went from over 78 seconds to 95 ms.
#
# The cost is compile time — an incremental rebuild of this crate is about 25 s
# rather than 15 — and `-O1` keeps debug info and does not reorder enough to make
# a backtrace lie. Dependencies go to `-O3`: they are compiled once and nobody
# steps through them.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
